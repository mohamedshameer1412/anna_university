function pc(p){return p>=85?'success':p>=65?'accent':p>=50?'warning':'muted'}
function dc(d){return d==='Hard'?'danger':d==='Easy'?'success':'warning'}
function tc(t){const s=t.toLowerCase();return s.includes('problem')?'danger':s.includes('formula')?'accent':s.includes('memory')?'muted':'success'}

function bdg(txt,role){
  return `<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg-${role});color:var(--text-${role});border:.5px solid var(--border-${role});white-space:nowrap">${txt}</span>`;
}

function bar(p,role){
  return `<div style="height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:2px 0 0"><div class="bf" data-w="${p}" style="height:100%;width:0;background:var(--text-${role});border-radius:2px"></div></div>`;
}

function secH(txt){
  return `<div style="display:flex;align-items:center;gap:8px;margin:20px 0 12px"><div style="width:3px;height:14px;background:var(--text-accent);border-radius:0"></div><span style="font-size:11px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.1em">${txt}</span></div>`;
}

function topicC(t){
  const r=pc(t.p),id='tc'+Math.random().toString(36).slice(2);
  return `<div style="border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer" onclick="var b=document.getElementById('${id}');b.style.display=b.style.display==='block'?'none':'block';this.querySelector('.ci').style.transform=b.style.display==='block'?'rotate(180deg)':'rotate(0)'">
      <div style="width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;background:var(--bg-${r});color:var(--text-${r});border:.5px solid var(--border-${r})">${t.p}%</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:4px">${t.n}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">${bdg(t.d,dc(t.d))}${bdg(t.h+'h',r)}${bdg(t.t,tc(t.t))}</div>
      </div>
      <i class="ci ti ti-chevron-down" style="font-size:16px;color:var(--text-muted);flex-shrink:0;transition:transform .2s" aria-hidden="true"></i>
    </div>
    <div style="padding:0 14px 8px">${bar(t.p,r)}</div>
    <div id="${id}" style="display:none;border-top:.5px solid var(--border);padding:14px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px">
        ${[['Probability',t.p+'%',`var(--text-${r})`],['Difficulty',t.d,'var(--text-primary)'],['Study time',t.h+' hrs','var(--text-primary)'],['Type',t.t,'var(--text-primary)']].map(([l,v,c])=>`<div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">${l}</div><div style="font-size:14px;font-weight:500;color:${c}">${v}</div></div>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--text-secondary);background:var(--surface-0);border-radius:var(--radius);padding:10px;border:.5px solid var(--border)">${t.r}</div>
    </div>
  </div>`;
}

function qC(q){
  return `<div style="background:var(--surface-1);border-radius:var(--radius);padding:11px 13px;margin-bottom:7px;font-size:13px;color:var(--text-primary);border-left:3px solid ${q.hot?'var(--text-success)':'var(--border)'};line-height:1.6">
    ${q.hot?`<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:var(--bg-success);color:var(--text-success);border:.5px solid var(--border-success);font-weight:500;margin-right:6px">★ High prob</span>`:''}
    ${q.q}
    <div style="margin-top:5px"><span style="font-size:11px;color:var(--text-muted)">${q.m} marks</span></div>
  </div>`;
}

function alert(txt,wt){
  return `<div style="background:var(--bg-${wt});border:.5px solid var(--border-${wt});border-radius:var(--radius);padding:10px 12px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start"><i class="ti ti-info-circle" style="font-size:16px;color:var(--text-${wt});flex-shrink:0;margin-top:1px" aria-hidden="true"></i><span style="color:var(--text-primary);font-size:13px">${txt}</span></div>`;
}

function unitP(u){
  return `<div style="background:var(--surface-1);border-radius:12px;padding:16px 20px;margin-bottom:16px;border:.5px solid var(--border)">
      <div style="font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:2px">${u.tab} · ${u.slot}</div>
      <div style="font-size:17px;font-weight:500;color:var(--text-primary);margin-bottom:8px">${u.name}</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Peak probability</div><div style="font-size:22px;font-weight:500;color:var(--text-${pc(u.peak)})">${u.peak}%</div></div>
        <div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Study time</div><div style="font-size:22px;font-weight:500;color:var(--text-primary)">${u.hrs}</div></div>
        <div><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Difficulty</div><div style="font-size:22px;font-weight:500;color:var(--text-${dc(u.diff)})">${u.diff}</div></div>
      </div>
    </div>
    ${alert(u.warn,u.wt)}
    ${secH('Topics by probability')}
    ${u.topics.map(topicC).join('')}
    ${secH('Most probable questions')}
    ${u.qs.map(qC).join('')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
      <div style="background:var(--surface-1);border-radius:12px;padding:14px;border:.5px solid var(--border-success)">
        <div style="font-size:11px;font-weight:500;color:var(--text-success);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:5px"><i class="ti ti-arrow-up" style="font-size:14px" aria-hidden="true"></i>High priority</div>
        ${u.hi.map(h=>`<div style="font-size:12px;color:var(--text-secondary);padding:3px 0;display:flex;gap:6px;line-height:1.5"><span style="color:var(--text-success);flex-shrink:0">→</span>${h}</div>`).join('')}
      </div>
      <div style="background:var(--surface-1);border-radius:12px;padding:14px;border:.5px solid var(--border-danger)">
        <div style="font-size:11px;font-weight:500;color:var(--text-danger);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:5px"><i class="ti ti-arrow-down" style="font-size:14px" aria-hidden="true"></i>Low priority</div>
        ${u.lo.map(l=>`<div style="font-size:12px;color:var(--text-secondary);padding:3px 0;display:flex;gap:6px;line-height:1.5"><span style="color:var(--text-muted);flex-shrink:0">→</span>${l}</div>`).join('')}
      </div>
    </div>`;
}

function overviewP(){
  const rows=TOP20.map((r,i)=>`<tr style="border-bottom:.5px solid var(--border)">
    <td style="padding:8px 10px;font-size:13px;font-weight:500;color:${i<3?'var(--text-warning)':'var(--text-muted)'};font-family:var(--font-mono)">${String(i+1).padStart(2,'0')}</td>
    <td style="padding:8px 10px;font-size:13px;color:var(--text-primary)">${r[0]}</td>
    <td style="padding:8px 10px"><span style="font-size:11px;padding:1px 6px;border-radius:3px;background:var(--bg-accent);color:var(--text-accent);border:.5px solid var(--border-accent)">${r[1]}</span></td>
    <td style="padding:8px 10px;font-size:13px;font-weight:500;font-family:var(--font-mono);color:${parseInt(r[2])>=85?'var(--text-success)':'var(--text-accent)'}">${r[2]}</td>
    <td style="padding:8px 10px;font-size:13px;color:var(--text-accent);font-family:var(--font-mono)">${r[3]}</td>
    <td style="padding:8px 10px;font-size:12px;color:var(--text-muted)">${r[4]}</td>
  </tr>`).join('');
  
  return `${alert('<strong>Smart start:</strong> Unit IV (555 Timer + SAR ADC + R-2R DAC) takes ~7 hrs and covers 13 guaranteed marks. Start here if time is limited.','success')}
    ${secH('Top 20% topics → 80% of marks')}
    <div style="background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:16px">
      <table style="width:100%;border-collapse:collapse;min-width:480px">
        <thead><tr style="background:var(--surface-0)">
          ${['#','Topic','Unit','Prob.','Marks','Effort'].map(h=>`<th style="text-align:left;padding:8px 10px;font-size:10px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;border-bottom:.5px solid var(--border)">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${secH('Paper structure — mark allocation')}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px">
      ${[['Part A','10 × 2 = 20 marks','All 10 questions compulsory. Guaranteed topics: slew rate, Q factor, PLL applications, Schmitt trigger, ring oscillator, phase margin.','accent'],
         ['Part B','5 × 13 = 65 marks','Q11–Q15, each with (a)/(b) OR choice. Q11 always feedback, Q14 always ADC/DAC/PLL, Q15 always tuned amplifier.','success'],
         ['Part C','1 × 15 = 15 marks','Q16 COMPULSORY — no OR option. Always design/derivation-heavy. Currently alternates between Unit I and Unit V.','warning']].map(([t,v,d,c])=>`
        <div style="background:var(--surface-1);border-radius:12px;padding:14px 16px;border:.5px solid var(--border-${c})">
          <div style="font-size:12px;font-weight:500;color:var(--text-${c});text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${t}</div>
          <div style="font-size:20px;font-weight:500;color:var(--text-primary);margin-bottom:6px">${v}</div>
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.6">${d}</div>
        </div>`).join('')}
    </div>
    ${secH('Fastest units to complete')}
    <div style="background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;overflow:hidden">
      ${[['1st','Unit IV — Special function ICs','7–8h','Structured formulas. SAR ADC, 555 timer, R-2R DAC. Highest ROI.','success'],
         ['2nd','Unit II — Op-amp','4–5h','Templated derivations. Integrator/differentiator patterns.','accent'],
         ['3rd','Unit I — Feedback amplifiers','5–6h','Only Q11 pattern matters. Focus on 3 topology types only.','pro'],
         ['4th','Unit III — Oscillators','8–10h','Oscillator formulas quick, but power amplifier derivations take time.','warning'],
         ['5th','Unit V — Tuned amplifiers','10–12h','Most complex numericals. Tapped inductor requires most practice.','danger']].map(([r,u,h,d,c],i)=>`
        <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:.5px solid ${i<4?'var(--border)':'none'}">
          <div style="font-size:13px;font-weight:500;color:var(--text-muted);font-family:var(--font-mono);min-width:24px">${r}</div>
          <div style="flex:1"><div style="font-size:13px;font-weight:500;color:var(--text-primary)">${u}</div><div style="font-size:12px;color:var(--text-secondary);margin-top:2px">${d}</div></div>
          <div style="font-size:13px;font-weight:500;color:var(--text-${c});font-family:var(--font-mono);white-space:nowrap">${h}</div>
        </div>`).join('')}
    </div>`;
}

function partcP(){
  return `${alert('<strong>Q16 is compulsory — 15 marks, no OR option.</strong> This is 15% of your total marks. Part C preparation is the single highest-leverage study decision you can make.','accent')}
    ${secH('Prediction for upcoming exam')}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:20px">
      ${PARTC.preds.map(p=>`
        <div style="background:var(--surface-1);border-radius:12px;padding:16px;border:.5px solid ${p.p===55?'var(--border-accent)':'var(--border)'}">
          <div style="font-size:10px;padding:2px 8px;border-radius:3px;background:var(--bg-${p.c});color:var(--text-${p.c});border:.5px solid var(--border-${p.c});display:inline-block;font-weight:500;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em">${p.p===55?'Best bet':'Alternative'} · ${p.p}%</div>
          <div style="font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:6px">${p.lbl}</div>
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px">${p.desc}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div class="bf" data-w="${p.p}" style="height:100%;width:0;background:var(--text-${p.c});border-radius:3px"></div></div>
            <span style="font-size:14px;font-weight:500;font-family:var(--font-mono);color:var(--text-${p.c})">${p.p}%</span>
          </div>
        </div>`).join('')}
    </div>
    ${secH('Historical Part C pattern')}
    <div style="background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="background:var(--surface-0)">${['Exam','Unit','Topic','Marks'].map(h=>`<th style="text-align:left;padding:8px 12px;font-size:10px;color:var(--text-muted);font-weight:500;text-transform:uppercase;border-bottom:.5px solid var(--border)">${h}</th>`).join('')}</tr></thead>
        <tbody>${PARTC.hist.map((r,i)=>{const uc={I:'accent',II:'pro',V:'warning'}[r.u]||'accent';return`<tr style="border-bottom:.5px solid ${i<3?'var(--border)':'none'}"><td style="padding:9px 12px;font-size:13px;font-weight:500;font-family:var(--font-mono);color:var(--text-primary)">${r.e}</td><td style="padding:9px 12px"><span style="font-size:11px;padding:1px 7px;border-radius:3px;background:var(--bg-${uc});color:var(--text-${uc});border:.5px solid var(--border-${uc})">${r.u}</span></td><td style="padding:9px 12px;font-size:12px;color:var(--text-secondary)">${r.t}</td><td style="padding:9px 12px;font-size:13px;font-weight:500;font-family:var(--font-mono);color:var(--text-success)">15</td></tr>`;}).join('')}</tbody>
      </table>
    </div>
    ${secH('Recommended preparation')}
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;font-size:13px;border-left:3px solid var(--text-accent);color:var(--text-primary);line-height:1.65"><strong>Primary — Unit I (55%):</strong> Practice inserting dominant pole for T(f)=2000/[(1+jf/10⁴)(1+jf/10⁶)(1+jf/10⁸)]. Find f_d for PM≥45°. Also: given T(f) with β·1000 in numerator, find β for 45° PM and calculate resulting closed-loop gain.</div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 14px;font-size:13px;border-left:3px solid var(--text-warning);color:var(--text-primary);line-height:1.65"><strong>Secondary — Unit V (35%):</strong> Tapped inductor design from specs: fo, BW, gm, Rin, Cin → find n, C, Rp_eff, gain. Key formulas: Reff=n²·Rin, BW=1/(2π·Rp_eff·C), Ic/Iin=1/n.</div>`;
}

function plannerP(){
  let total=0;
  PLAN.forEach(s=>s.items.forEach(i=>total+=i.h));
  return `<div style="background:var(--surface-1);border:.5px solid var(--border-accent);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div><div style="font-size:13px;color:var(--text-secondary)">Total study hours remaining</div><div style="font-size:12px;color:var(--text-muted);margin-top:2px">Check off topics as you complete them</div></div>
      <div style="text-align:right"><div id="hr-tot" style="font-size:32px;font-weight:500;color:var(--text-accent);font-family:var(--font-mono)">${total}</div><div id="hr-pct" style="font-size:12px;color:var(--text-muted)">0% complete</div></div>
    </div>
    ${PLAN.map(s=>`<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;padding:10px 0 4px">${s.u}</div>
    ${s.items.map(item=>`<div class="pli" data-h="${item.h}" style="display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer" onclick="tP(this)">
      <input type="checkbox" style="accent-color:var(--fill-success);width:14px;height:14px;flex-shrink:0;margin-top:1px;cursor:pointer" onclick="event.stopPropagation()">
      <span class="pll" style="flex:1;font-size:13px;color:var(--text-primary)">${item.t}</span>
      <span style="font-size:12px;font-family:var(--font-mono);color:var(--text-accent);font-weight:500;white-space:nowrap">${item.h}h</span>
    </div>`).join('')}`).join('')}`;
}

const TABS=['Overview','Unit I','Unit II','Unit III','Unit IV','Unit V','Part C','Planner'];
const PANELS=[overviewP(),...U.map(unitP),partcP(),plannerP()];

document.getElementById('ar').innerHTML=`
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap">
    <div style="background:var(--bg-accent);border:.5px solid var(--border-accent);border-radius:var(--radius);padding:4px 10px;font-size:12px;color:var(--text-accent);font-family:var(--font-mono)">EC23C05</div>
    <div>
      <div style="font-size:16px;font-weight:500;color:var(--text-primary)">AESD exam intelligence dashboard</div>
      <div style="font-size:12px;color:var(--text-secondary)">Anna University · Reg 2023 · Semester IV · 5 papers analysed (2021–2025)</div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:1.25rem">
    ${[{v:'5',l:'Papers',s:'2021–2025'},{v:'8',l:'Guaranteed',s:'100% rate'},{v:'46h',l:'Full prep',s:'all 5 units'},{v:'20h',l:'Smart prep',s:'top 20%'},{v:'15',l:'Part C',s:'compulsory'},{v:'98%',l:'Peak prob.',s:'Q11+Q15'}].map(s=>`<div style="background:var(--surface-1);border-radius:var(--radius);padding:.75rem 1rem"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">${s.l}</div><div style="font-size:20px;font-weight:500;color:var(--text-primary);margin-bottom:1px">${s.v}</div><div style="font-size:11px;color:var(--text-secondary)">${s.s}</div></div>`).join('')}
  </div>
  <div id="tbr" style="display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--border);margin-bottom:1.25rem;position:sticky;top:0;background:var(--surface-0,var(--surface-2));z-index:10;padding:.375rem 0 0">
    ${TABS.map((t,i)=>`<button id="tb${i}" onclick="sw(${i})" style="background:none;border:none;padding:7px 13px;font-size:13px;cursor:pointer;color:${i===0?'var(--text-accent)':'var(--text-secondary)'};border-bottom:2px solid ${i===0?'var(--text-accent)':'transparent'};white-space:nowrap;font-family:inherit;transition:color .15s">${t}</button>`).join('')}
  </div>
  <div id="pnls">${PANELS.map((p,i)=>`<div id="pn${i}" style="display:${i===0?'block':'none'}">${p}</div>`).join('')}</div>
`;

function sw(i){
  for(let j=0;j<TABS.length;j++){
    const b=document.getElementById('tb'+j),p=document.getElementById('pn'+j);
    if(b){b.style.color=j===i?'var(--text-accent)':'var(--text-secondary)';b.style.borderBottom=j===i?'2px solid var(--text-accent)':'2px solid transparent';}
    if(p)p.style.display=j===i?'block':'none';
  }
  setTimeout(aB,80);
}

function aB(){
  document.querySelectorAll('#pnls .bf').forEach(el=>{
    const pn=el.closest('[id^=pn]');
    if(pn&&pn.style.display!=='none'){const w=el.getAttribute('data-w');if(w&&el.style.width==='0%'||el.style.width==='')el.style.width=w+'%';}
  });
}

function tP(el){
  const cb=el.querySelector('input');
  cb.checked=!cb.checked;
  const on=cb.checked;
  el.style.borderColor=on?'var(--border-success)':'var(--border)';
  el.style.background=on?'var(--bg-success)':'';
  const lbl=el.querySelector('.pll');
  if(lbl){lbl.style.textDecoration=on?'line-through':'none';lbl.style.color=on?'var(--text-muted)':'var(--text-primary)';}
  let tot=0,dn=0;
  document.querySelectorAll('.pli').forEach(e=>{const h=parseFloat(e.getAttribute('data-h')||0);tot+=h;if(e.querySelector('input').checked)dn+=h;});
  const ht=document.getElementById('hr-tot'),hp=document.getElementById('hr-pct');
  if(ht)ht.textContent=Math.round((tot-dn)*10)/10;
  if(hp)hp.textContent=Math.round(dn/tot*100)+'% complete';
}

const st=document.createElement('style');
st.textContent='#tbr::-webkit-scrollbar{display:none}.bf{transition:width .55s cubic-bezier(.22,1,.36,1)}';
document.head.appendChild(st);
setTimeout(aB,500);
</script>
</div>
</body>
