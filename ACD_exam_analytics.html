/* =========================================================

========================================================= */

function renderNav() {

const nav = document.getElementById("mainNav");

nav.innerHTML = `
<button
  onclick="setActive('summary')"
  id="nav-summary">
  📊 Summary
</button>

${units.map(u => `
<button
  onclick="setActive(${u.id})"
  id="nav-${u.id}">
  Unit ${u.id}
</button>
`).join("")}
`;

updateNav();
}


function updateNav() {

document.querySelectorAll(".nav button").forEach(btn => {

btn.style.background = "#fff";
btn.style.color = "#374151";

});

const activeBtn = document.getElementById(`nav-${activeUnit}`);

if (!activeBtn) return;

if (activeUnit === "summary") {

activeBtn.style.background = "#1e1b4b";
activeBtn.style.color = "#fff";

} else {

const unit = units.find(u => u.id === activeUnit);

activeBtn.style.background = unit.color;
activeBtn.style.color = "#fff";

}

}


function setActive(unit) {

activeUnit = unit;

renderContent();
updateNav();

window.scrollTo({
top: 0,
behavior: "smooth"
});

}


/* =========================================================
   TOPIC CARD
========================================================= */

function renderTopic(topic, color) {

return `
<div
  class="topic-card"
  style="border-color:${color}22"
  onclick="toggleTopic(this)">

  <div class="topic-header">

    <div class="topic-title-row">

      <span class="topic-title">
        ${topic.name}
      </span>

      <span class="arrow">
        ▼
      </span>

    </div>

    <div class="prob-row">

      <div class="prob-track">

        <div
          class="prob-fill"
          style="width:${topic.prob}%;background:${color}">
        </div>

      </div>

      <span
        class="prob-value"
        style="color:${color}">
        ${topic.prob}%
      </span>

    </div>

    <div class="meta">

      <span class="badge ${topic.toughness.toLowerCase()}">
        ${topic.toughness}
      </span>

      <span class="badge time-badge">
        ⏱ ${topic.time}
      </span>

      <span class="badge type-badge">
        ${topic.type}
      </span>

    </div>

  </div>

  <div
    class="topic-reason"
    style="border-color:${color}22">

    <strong>Why this matters:</strong>
    ${topic.reason}

  </div>

</div>
`;

}


function toggleTopic(card) {

card.classList.toggle("open");

const arrow = card.querySelector(".arrow");

arrow.textContent =
card.classList.contains("open") ? "▲" : "▼";

}

  <div class="unit-title">

    <span

  </div>

</div>

`;

}


function renderTopics(unit) {

const sorted = [...unit.topics]
.sort((a,b) => b.prob - a.prob);

return sorted
.map(t => renderTopic(t, unit.color))
.join("");

}


function showTab(unitId, tab) {

const unit = units.find(u => u.id === unitId);

const content = document.getElementById(
`unit-content-${unitId}`
);

document.querySelectorAll(
`#tab-${unitId}-topics,
 #tab-${unitId}-q16,
 #tab-${unitId}-q8,
 #tab-${unitId}-priority`
).forEach(button => {

button.style.background = "#fff";
button.style.color = "#374151";

});

const activeTab =
document.getElementById(`tab-${unitId}-${tab}`);

activeTab.style.background = unit.color;
activeTab.style.color = "#fff";


if (tab === "topics") {

content.innerHTML = renderTopics(unit);

}


if (tab === "q16") {

content.innerHTML = `

<p class="question-intro">
Most probable 13-mark (Part B) questions based on pattern analysis:
</p>

${unit.q16.map((q,i) => `

<div
  class="question"
  style="
    border-color:${unit.color}33;
    border-left-color:${unit.color};
  ">

  <span
    class="question-number"
    style="color:${unit.color}">
    Q${i+1}.

  ${q}

</div>

`).join("")}

`;

}


if (tab === "q8") {

content.innerHTML = `

${unit.q8.map((q,i) => `

`;

}


if (tab === "priority") {

content.innerHTML = `

  <p class="priority-title">
    🔥 HIGH PRIORITY — Must Prepare
  </p>

  ${unit.highPri.map(p => `
    <div class="priority-item">

</div>


<div class="priority-section low-priority">

  <p class="priority-title">
    ⬇ LOW PRIORITY — Skip if Short on Time
  </p>

  ${unit.lowPri.map(p => `
    <div class="priority-item">
      ✗ ${p}
    </div>
  `).join("")}

</div>

`;

}

}
