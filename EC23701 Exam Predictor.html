<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EC23701 Exam Predictor</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf0f5; --panel:#fbfdff; --panel2:#f1f6fa; --ink:#0d2233; --muted:#52687a; --line:#cbd8e3;
  --accent:#1c58c9; --accent-soft:#dbe7fb; --grid:rgba(28,88,201,.07); --pl:42%;
  --good:#0d7f57; --warn:#b36b00; --bad:#b8321d; --shadow:0 1px 0 rgba(13,34,51,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1620; --panel:#112331; --panel2:#0e1d2a; --ink:#e4edf4; --muted:#92a8b9; --line:#25405a;
    --accent:#6c9cf5; --accent-soft:#17324f; --grid:rgba(108,156,245,.07); --pl:58%;
    --good:#4cc79a; --warn:#e3a53d; --bad:#f2806a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1620; --panel:#112331; --panel2:#0e1d2a; --ink:#e4edf4; --muted:#92a8b9; --line:#25405a;
  --accent:#6c9cf5; --accent-soft:#17324f; --grid:rgba(108,156,245,.07); --pl:58%;
  --good:#4cc79a; --warn:#e3a53d; --bad:#f2806a; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{
  margin:0;background-color:var(--bg);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  font-family:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
h2{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.sub{color:var(--muted);max-width:60ch;margin:0}
button,select,input{font:inherit;color:inherit}
button.ghost{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button.ghost:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

nav#tabs{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;
  background:var(--bg);padding:8px 0 0;margin:0 -14px;padding-left:14px;padding-right:14px;
  border-bottom:1px solid var(--line);scrollbar-width:thin;
}
nav#tabs button{
  flex:0 0 auto;background:none;border:0;border-bottom:4px solid var(--tc,var(--line));padding:8px 12px 7px;
  cursor:pointer;color:var(--muted);font-weight:600;border-radius:4px 4px 0 0;white-space:nowrap;
}
nav#tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel)}
nav#tabs button:hover{color:var(--ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi b{display:block;font-size:28px;line-height:1.1;font-weight:800}
.kpi span{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* probability bars */
.bar{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.pv{font-weight:800;font-size:18px;min-width:3.2ch;text-align:right}

.surebets .row{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.surebets .row:first-child{border-top:0}
.surebets .bar{grid-column:1 / -1}
.surebets .nm{font-weight:600}
.surebets .un{color:var(--muted);font-weight:500;font-size:13px}

/* topics */
.topic{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:9px}
.topic.is-done{opacity:.55}
.t-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:7px}
.t-title{font-weight:700}
.tid{display:inline-block;margin-right:8px;color:var(--muted);font-weight:600}
.chk{position:relative;width:22px;height:22px;display:inline-block}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.chk span{position:absolute;inset:0;border:2px solid var(--line);border-radius:5px;background:var(--panel2)}
.chk input:checked + span{background:var(--accent);border-color:var(--accent)}
.chk input:checked + span::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--muted)}
.chip.Easy{color:var(--good);border-color:var(--good)}
.chip.Medium{color:var(--warn);border-color:var(--warn)}
.chip.Hard{color:var(--bad);border-color:var(--bad)}
.chip.risk{color:var(--bad);border-style:dashed}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px}
details p{margin-top:6px}
.ev{color:var(--muted);font-size:13px}

.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qp{font-weight:800;font-size:17px}
.qlist .bar{margin-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.toolbar select,.toolbar input[type=range]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted)}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--panel2);white-space:nowrap}
th.sort{cursor:pointer}
th.sort:hover{color:var(--accent)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

/* heatmap */
.hm td,.hm th{padding:5px 7px;text-align:center;font-size:13px}
.hm td:first-child,.hm th:first-child{text-align:left}
.hm .L{background:var(--accent);color:#fff;font-weight:700}
.hm .S{background:var(--accent-soft);color:var(--ink)}
.hm .N{color:var(--line)}

.callouts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:14px}
.callouts h3{margin-bottom:8px}
.callouts li{margin:3px 0}
.pill{display:inline-block;border-radius:999px;padding:0 8px;background:var(--accent-soft);font-size:12.5px;margin-left:4px}
.note{border-left:4px solid var(--warn);padding:8px 12px;background:var(--panel2);border-radius:0 6px 6px 0;margin:10px 0}
.note.bad{border-left-color:var(--bad)}
.num-card{margin-bottom:10px}
.num-card .f{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:6px 0;overflow-x:auto}
.ans{font-weight:700;color:var(--good)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.wk div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.wk b{display:block;font-size:17px}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.bar2{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.bar2 .b{height:12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar2 .b i{display:block;height:100%}
.slot{margin-bottom:12px}
.slot h3 span{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
</style>
</head>

    <p class="muted small" style="margin-top:8px">Upper bar ES22, lower bar ES23. Expect Units I, II and V at about 17 each, and Units III and IV to share the remaining 49 marks.</p>
  </div>

  <h2>Syllabus items vs items actually asked</h2>
  <div class="tw"><table>
    <thead><tr><th>Unit</th><th class="num">Syllabus items</th><th class="num">Asked in papers</th><th>Gap to watch</th></tr></thead>
    <tbody>
     <tr><td>I</td><td class="num">8</td><td class="num">5</td><td>Standards and coexistence, Gigabit wireless, propagation as a standalone topic</td></tr>
     <tr><td>II</td><td class="num">6</td><td class="num">4</td><td>MIMO arrays, design considerations</td></tr>
     <tr><td>III</td><td class="num">6</td><td class="num">5</td><td>Introduction to optical communication; nonlinear effects are asked but not named</td></tr>
     <tr><td>IV</td><td class="num">12</td><td class="num">10</td><td>Materials and preamplifiers get thin coverage in R2019 papers</td></tr>
     <tr><td>V</td><td class="num">10</td><td class="num">6</td><td>Line-of-sight analysis, network integration, installation, receiver subsystems</td></tr>
    </tbody></table></div>

  <h2>Topic history across the papers</h2>
  <p class="muted small">Dark cell: long answer (5 marks or more). Light cell: short question. Hover a column heading for the paper. The R2015 legacy papers are used only for supporting counts, not in this grid.</p>
  <div class="tw hm"><table>
    <thead><tr><th>Topic</th>${PAPERS.map(p=>`<th title="${esc(PAPER_FULL[p])}">${p}</th>`).join('')}<th>Hits</th></tr></thead>
    <tbody>${HEAT.map(([n,c])=>`<tr><td>${esc(n)}</td>${[...c].map(x=>`<td class="${x==='-'?'N':x}">${x==='-'?'–':x==='L'?'Long':'Short'}</td>`).join('')}<td><b>${[...c].filter(x=>x!=='-').length}</b></td></tr>`).join('')}</tbody>
  </table></div>`;
}

function viewUnit(id){
  const u = UNITS.find(x=>x.id===id);
  const st = (viewUnit.state = viewUnit.state || {sort:'p', hide:false});
  let list = [...u.topics];
  const keyf = {p:t=>-t.p, h:t=>t.h, r:t=>-ratio(t), e:t=>-expM(t)}[st.sort];
  list.sort((a,b)=>keyf(a)-keyf(b));
  if (st.hide) list = list.filter(t=>!store.done[t.id]);
  const core = u.topics.filter(t=>t.p>=60);
  const coreH = core.reduce((a,t)=>a+t.h,0);
  const expU = u.topics.reduce((a,t)=>a+expM(t),0);
  return `
  <div style="margin-top:16px">
    <h2 style="margin-top:6px">Unit ${u.short}: ${esc(u.name)}</h2>
    <p class="muted">${esc(u.syl)}</p>
    <p class="muted small">${esc(u.es)}</p>
    <div class="grid g4" style="margin:10px 0">
      <div class="panel kpi"><b>${u.topics.length}</b><span>topics</span></div>
      <div class="panel kpi"><b>${fmt(coreH)} h</b><span>to cover the ${core.length} topics at 60% or above</span></div>
      <div class="panel kpi"><b>${fmt(u.topics.reduce((a,t)=>a+t.h,0))} h</b><span>for the whole unit</span></div>
      <div class="panel kpi"><b>${fmt(expU/core.length || 0)}</b><span>average expected marks per core topic</span></div>
    </div>
    <h2>1. Most important topics</h2>
    <div class="toolbar">
      <label>Sort by <select id="uSort">
        <option value="p" ${st.sort==='p'?'selected':''}>Probability</option>
        <option value="r" ${st.sort==='r'?'selected':''}>Probability per hour</option>
        <option value="e" ${st.sort==='e'?'selected':''}>Expected marks</option>
        <option value="h" ${st.sort==='h'?'selected':''}>Study time (shortest)</option></select></label>
      <label><input type="checkbox" id="uHide" ${st.hide?'checked':''}> Hide studied</label>
    </div>
    ${list.map(topicCard).join('') || '<p class="muted">Every topic in this unit is marked as studied.</p>'}
    <h2>2. Most probable long answers (13M Part B, 15M Part C)</h2>
    <div class="panel">${qList(u.q13)}</div>
    <h2>3. Most probable sub-part questions (4 to 9 marks)</h2>
    <div class="panel">${qList(u.q9)}</div>
    <div class="grid g2" style="margin-top:12px">
      <div class="panel"><h3>4. High priority, even if repeated recently</h3><ul class="plain">${u.high.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="panel"><h3>5. Low priority, skip if time is short</h3><ul class="plain">${u.low.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
  </div>`;
}

function paretoStats(){
  const s = [...ALL].sort((a,b)=>expM(b)-expM(a));
  let cum = 0; const pts = []; let n80 = null;
  s.forEach((t,i)=>{ cum += expM(t); pts.push(cum/TOTAL_EXP); if (n80===null && cum/TOTAL_EXP>=0.8) n80 = i+1; });
  const k = Math.ceil(0.2*s.length);
  return {s, pts, k, share:pts[k-1], n80, hours:s.slice(0,k).reduce((a,t)=>a+t.h,0), hours80:s.slice(0,n80).reduce((a,t)=>a+t.h,0)};
}
function paretoSvg(P){
  const W=420,H=190,L=34,B=24,T=8,R=8, n=P.pts.length;
  const x=i=>L+(W-L-R)*(i+1)/n, y=v=>T+(H-T-B)*(1-v);
  const path = P.pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const kx = x(P.k-1), ky = y(P.share);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative share of expected marks by number of topics studied">
   ${[0,.25,.5,.75,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+3}">${Math.round(v*100)}%</text>`).join('')}
   <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
   <line x1="${kx}" x2="${kx}" y1="${ky}" y2="${H-B}" stroke="var(--bad)" stroke-dasharray="4 3"/>
   <circle cx="${kx}" cy="${ky}" r="4" fill="var(--bad)"/>
   <text x="${Math.min(kx+6,W-130)}" y="${ky+16}">top 20%: ${Math.round(P.share*100)}% of marks</text>
   <text x="${L}" y="${H-6}">topics studied, best first</text>
  </svg>`;
}

function viewRank(){
  const st = (viewRank.state = viewRank.state || {key:'p',dir:-1,unit:0,tough:'all'});
  const P = paretoStats();
  const safest = ALL.filter(t=>t.p>=80 && t.t==='Easy').sort((a,b)=>b.p-a.p);
  const hardest = ALL.filter(t=>t.t==='Hard').sort((a,b)=>b.p-a.p);
  const unitStats = UNITS.map(u=>{
    const c = u.topics.filter(t=>t.p>=60);
    const h = c.reduce((a,t)=>a+t.h,0), e = c.reduce((a,t)=>a+expM(t),0);
    return {u, h, e, per:e/h, all:u.topics.reduce((a,t)=>a+t.h,0)};
  }).sort((a,b)=>a.h-b.h);
  const best = [...ALL].sort((a,b)=>ratio(b)-ratio(a)).slice(0,10);
  const top = P.s.slice(0,P.k);
  let rows = ALL.filter(t=>(!st.unit||t.u===st.unit)&&(st.tough==='all'||t.t===st.tough));
  const val = {p:t=>t.p,h:t=>t.h,r:ratio,e:expM,m:t=>t.m,u:t=>t.u,t:t=>({Easy:1,Medium:2,Hard:3})[t.t],n:t=>t.n}[st.key];
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*st.dir;});
  const th = (k,l,c='')=>`<th class="sort ${c}" data-sort="${k}">${l}${st.key===k?(st.dir<0?' ▾':' ▴'):''}</th>`;
  return `
  <div style="margin-top:16px">
  <div class="callouts">
    <div class="panel"><h3>Safest scoring</h3><p class="muted small">Easy and 80% or higher.</p><ul class="plain">${safest.map(t=>`<li>${esc(t.n)}<span class="pill">${t.p}%</span></li>`).join('')}</ul></div>
    <div class="panel"><h3>Hardest</h3><p class="muted small">Hard-rated, by probability. Start early.</p><ul class="plain">${hardest.map(t=>`<li>${esc(t.n)}<span class="pill">${t.p}%</span></li>`).join('')}</ul></div>
    <div class="panel"><h3>Fastest units to finish</h3><p class="muted small">Hours to cover every topic at 60% or above.</p><ul class="plain">${unitStats.map(s=>`<li>Unit ${s.u.short}: ${fmt(s.h)} h <span class="muted">(${fmt(s.per)} expected marks per hour; whole unit ${fmt(s.all)} h)</span></li>`).join('')}</ul></div>
    <div class="panel"><h3>Best probability per hour</h3><ul class="plain">${best.map(t=>`<li>${esc(t.n)}<span class="pill">${fmt(ratio(t))}%/h</span></li>`).join('')}</ul></div>
  </div>
  <div class="panel">
    <h3>Top 20% of topics</h3>
    <p>The best ${P.k} topics by expected marks cover <b>${Math.round(P.share*100)}%</b> of the total expected marks, in ${fmt(P.hours)} hours. Reaching 80% takes ${P.n80} topics (${fmt(P.hours80)} hours).</p>
    <p class="muted small">This paper is flatter than a classic 80/20 split: five units each get a compulsory-style Part-A pair and a 13-mark slot, and Part B has only one OR choice per unit. Use the curve to decide where extra hours stop paying.</p>
    ${paretoSvg(P)}
    <ul class="plain">${top.map(t=>`<li>${esc(t.n)} <span class="muted">(Unit ${t.us}, about ${fmt(expM(t))} expected marks)</span></li>`).join('')}</ul>
  </div>

  <h2>All topics, ranked</h2>
  <div class="toolbar">
    <label>Unit <select id="rUnit"><option value="0">All</option>${UNITS.map(u=>`<option value="${u.id}" ${st.unit===u.id?'selected':''}>${u.short}</option>`).join('')}</select></label>
    <label>Difficulty <select id="rTough">${['all','Easy','Medium','Hard'].map(x=>`<option ${st.tough===x?'selected':''} value="${x}">${x==='all'?'All':x}</option>`).join('')}</select></label>
    <span class="muted small">Click a column heading to sort.</span>
  </div>
  <div class="tw"><table>
   <thead><tr>${th('n','Topic')}${th('u','Unit')}${th('p','Probability','num')}${th('t','Difficulty')}${th('h','Hours','num')}${th('r','Prob per hour','num')}${th('e','Expected marks','num')}</tr></thead>
   <tbody>${rows.map((t,i)=>`<tr><td>${esc(t.n)}${t.r?' <span class="chip risk">syllabus risk</span>':''}</td><td>${t.us}</td><td class="num"><b style="color:${pcol(t.p)}">${t.p}%</b></td><td><span class="chip ${t.t}">${t.t}</span></td><td class="num">${t.h}</td><td class="num">${fmt(ratio(t))}</td><td class="num">${fmt(expM(t))}</td></tr>`).join('')}</tbody>
  </table></div></div>`;
}

function viewBlue(){
  const slot = (title, sub, arr) => `<div class="panel slot"><h3>${title}<span>${sub}</span></h3>${qList(arr.map(([q,p])=>({q,p})))}</div>`;
  return `
  <div style="margin-top:16px">
  <h2 style="margin-top:6px">Likely end-sem paper</h2>
  <p class="muted">Assumes the R2019 end-sem layout continues: Part A 10×2, Part B 5×13 with an OR in every slot, Part C 1×15 compulsory. No R2023 end-sem paper exists yet, so confirm the layout with your department. Percentages are the chance a candidate shows up in that slot.</p>
  <div class="note"><b>Mark-scheme note.</b> You asked for 16-mark and 8-mark questions. The papers use 13 and 15: Part B splits 9+4, 8+5 or 7+6, Part C splits 9+4+2 or 5+10. The question lists in each unit use those real splits.</div>

  <h2>Part A: two questions per unit (2 marks each)</h2>
  ${A_SLOTS.map(s=>slot(`Unit ${UNITS[s.u-1].short} pair`, UNITS[s.u-1].name, s.c)).join('')}

  <h2>Part B: one 13-mark slot per unit, each with an OR</h2>
  <p class="muted small">An option can combine a 9M and a 4M topic, so the percentages in a slot add up to more than 200.</p>
  ${B_SLOTS.map(s=>slot(`${s.q}, Unit ${UNITS[s.u-1].short}`, UNITS[s.u-1].name, s.c)).join('')}

  <h2>Part C: compulsory 15 marks (Unit III or IV)</h2>
  <div class="panel slot"><h3>Q16 theme<span>chances add to 100%</span></h3>${qList(C_OPTS.map(([q,p])=>({q,p})))}</div>
  </div>`;
}

function viewNum(){
  const st = (viewNum.state = viewNum.state || {u:0});
  const list = NUMS.filter(n=>!st.u || n.u===st.u);
  return `
  <div style="margin-top:16px">
  <h2 style="margin-top:6px">Numerical bank</h2>
  <p class="muted">Every formula-driven question seen in the papers, solved. Try it first, then open the answer. Values recomputed from the formulas; where a published key disagrees, the flag says so.</p>
  <div class="toolbar">
    <label>Unit <select id="nUnit"><option value="0">All</option>${UNITS.map(u=>`<option value="${u.id}" ${st.u===u.id?'selected':''}>${u.short} ${esc(u.name)}</option>`).join('')}</select></label>
  </div>
  ${list.map(n=>`<div class="panel num-card">
    <h3>${esc(n.t)} <span class="pill">Unit ${UNITS[n.u-1].short}</span></h3>
    <div class="f">${esc(n.f)}</div>
    <p>${esc(n.w)}</p>
    <details><summary>Show answer</summary><p class="ans">${esc(n.a)}</p></details>
    <p class="muted small" style="margin-top:6px">Seen in: ${esc(n.s)}</p>
  </div>`).join('')}
  </div>`;
}

function viewPlan(){
  const st = (viewPlan.state = viewPlan.state || {h:40, min:0, risk:true});
  const sorted = [...ALL].filter(t=>t.p>=st.min && !(st.risk && t.r)).sort((a,b)=>(expM(b)/b.h)-(expM(a)/a.h));
  let cumH = 0, cumE = 0; const picked = [];
  for (const t of sorted){ if (cumH + t.h <= st.h){ cumH += t.h; cumE += expM(t); picked.push({t, cumH, cumE}); } }
  const doneH = ALL.filter(t=>store.done[t.id]).reduce((a,t)=>a+t.h,0);
  const doneN = ALL.filter(t=>store.done[t.id]).length;
  const allH = ALL.reduce((a,t)=>a+t.h,0);
  return `
  <div style="margin-top:16px">
  <h2 style="margin-top:6px">Study plan builder</h2>
  <p class="muted">Pick the hours you have. Topics are chosen by expected marks per hour until the budget runs out.</p>
  <div class="panel">
    <div class="toolbar">
      <label>Hours available: <b id="hLab">${st.h}</b> <input type="range" id="pH" min="4" max="${Math.ceil(allH)}" step="1" value="${st.h}"></label>
      <label>Minimum probability <select id="pMin">${[0,30,50,70].map(v=>`<option value="${v}" ${st.min===v?'selected':''}>${v}%</option>`).join('')}</select></label>
      <label><input type="checkbox" id="pRisk" ${st.risk?'checked':''}> Skip syllabus-risk topics</label>
    </div>
    <div class="grid g4">
      <div class="kpi"><b>${picked.length}</b><span>topics fit</span></div>
      <div class="kpi"><b>${fmt(cumH)} h</b><span>planned</span></div>
      <div class="kpi"><b>${Math.round(cumE/TOTAL_EXP*100)}%</b><span>of all expected marks covered</span></div>
      <div class="kpi"><b>${doneN} (${fmt(doneH)} h)</b><span>topics ticked as studied so far</span></div>
    </div>
  </div>
  <div class="tw" style="margin-top:12px"><table>
    <thead><tr><th>Order</th><th>Topic</th><th>Unit</th><th class="num">Hours</th><th class="num">Running hours</th><th class="num">Coverage</th></tr></thead>
    <tbody>${picked.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.t.n)}</td><td>${x.t.us}</td><td class="num">${x.t.h}</td><td class="num">${fmt(x.cumH)}</td><td class="num">${Math.round(x.cumE/TOTAL_EXP*100)}%</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="muted small" style="margin-top:8px">Tick topics in the unit tabs and your progress shows here. The tick marks are saved in this browser only.</p>
  </div>`;
}

function viewNotes(){
  return `
  <div style="margin-top:16px">
  <h2 style="margin-top:6px">Flags worth reading before you trust any number</h2>
  <div class="note bad"><b>Answer-key conflicts.</b> The first copy of the Sep 2023 key says 10° light will not propagate and 25° will, with a delay difference of 30.3 µs. Both are wrong. Acceptance angle is 12.2°, so 10° is launched and 25° is not, and the delay difference is 303 ns. The corrected copy in the same file fixes the angle statement and the 303 ns figure.</div>
  <div class="note bad"><b>Handwritten ES23 check.</b> Critical angle is shown as 81.49°. sin⁻¹(1.435/1.450) gives 81.75°. The acceptance angle (12°), beat-length answer (1.87×10⁻⁵), rms broadening (86.6 ns), mode count (about 2170) and path loss (64.48 dB) all check out.</div>
  <div class="note"><b>Syllabus drift.</b> R2023 does not list modulation schemes (ASK, FSK, PSK, QPSK), indoor optical link configurations or coherent detection by name, yet R2019 end-sems asked them. They are ranked low or flagged "syllabus risk". The old "receiver with and without LO" question is mapped to the R2023 phrase "receiver without oscillator" in Unit II.</div>
  <div class="note"><b>Legacy papers.</b> The 14 EC7701 (R2015) papers include preform fabrication, couplers, isolators, EDFA, SONET, WDM networks, DCF and photonic crystal fibers. None are in the R2023 syllabus, so they are excluded. Those papers only add supporting hit counts for overlapping topics (attenuation, LED, laser, PIN noise, preamplifiers, external modulation).</div>

  <h2>How the numbers were built</h2>
  <div class="panel">
    <ul class="plain">
     <li><b>Papers:</b> 23 total. EC5701/EC23701: 9 (ES Nov/Dec 2022 and 2023, six internals, Aug 2026 Assessment 1). EC7701: 14 (4 end-sems, 10 internals).</li>
     <li><b>Probability:</b> an analyst estimate anchored on hit rate. End-sem hits count most, R2019/R2023 internals next, legacy papers least. Topics asked in the Aug 2026 internal get a small boost, topics missing from the R2023 syllabus a penalty. It is not a statistical guarantee.</li>
     <li><b>Thin data:</b> only two R2019 end-sems and no R2023 end-sem exist. Units I, II and V rest on four mmWave/FSO papers. Treat their percentages as softer than Units III and IV.</li>
     <li><b>Expected marks:</b> probability × typical marks when the topic appears. It overlaps across topics, so use it for ranking, not for adding up to 100.</li>
     <li><b>Hours:</b> study-time estimates for an ECE student who has seen the unit once.</li>
    </ul>
  </div>
  <div class="note"><b>Next paper to feed in.</b> Assessment 2 of 2026 is not in the dataset. In 2023 it covered Units I, II and V plus receivers, so it will become the next recycle pool for those units. Re-run the analysis when you have it.</div>
  <div class="note"><b>Aug 2026 Assessment 1 answers.</b> Check yourself in the Numericals tab: Q3 V = 2.19 (single-mode), Q4 500 MHz, Q7 80 µA, 7a(i) and 7b(i) V = 36.96 with about 683 modes if step-index, Part C about 1.36 ns chromatic broadening and about 296 Mb/s.</div>
  </div>`;
}

/* ---------- router and events ---------- */
const VIEWS = {overview:viewOverview,u1:()=>viewUnit(1),u2:()=>viewUnit(2),u3:()=>viewUnit(3),u4:()=>viewUnit(4),u5:()=>viewUnit(5),rank:viewRank,blue:viewBlue,num:viewNum,plan:viewPlan,notes:viewNotes};
let current = 'overview';
function go(id, keepScroll){
  if (!VIEWS[id]) id = 'overview';
  current = id;
  renderTabs(id);
  $('#view').innerHTML = VIEWS[id]();
  animateBars();
  if (!keepScroll) { try { history.replaceState(null,'','#'+id); } catch(e){} window.scrollTo({top:0}); }
}
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { go(tb.dataset.tab); return; }
  const sh = e.target.closest('[data-sort]');
  if (sh) {
    const s = viewRank.state, k = sh.dataset.sort;
    if (s.key===k) s.dir *= -1; else { s.key = k; s.dir = (k==='n'||k==='u'||k==='h')?1:-1; }
    go('rank', true);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.done) { store.done[t.dataset.done] = t.checked; if (!t.checked) delete store.done[t.dataset.done]; save(); go(current, true); return; }
  if (t.id==='uSort') { viewUnit.state.sort = t.value; go(current, true); }
  else if (t.id==='uHide') { viewUnit.state.hide = t.checked; go(current, true); }
  else if (t.id==='rUnit') { viewRank.state.unit = +t.value; go('rank', true); }
  else if (t.id==='rTough') { viewRank.state.tough = t.value; go('rank', true); }
  else if (t.id==='nUnit') { viewNum.state.u = +t.value; go('num', true); }
  else if (t.id==='pMin') { viewPlan.state.min = +t.value; go('plan', true); }
  else if (t.id==='pRisk') { viewPlan.state.risk = t.checked; go('plan', true); }
});
document.addEventListener('input', e => {
  if (e.target.id==='pH') { viewPlan.state.h = +e.target.value; $('#hLab').textContent = e.target.value; }
});
document.addEventListener('change', e => { if (e.target.id==='pH') go('plan', true); });
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.theme = next; save();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h!==current) go(h, true); });
go((location.hash||'#overview').slice(1), true);
</script>
